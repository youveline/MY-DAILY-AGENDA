<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>My Agenda & Routine</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #fff0f5;
      --bg-card: #ffffff;
      --primary: #d53f8c;
      --primary-soft: #f472b6;
      --accent: #9f7aea;
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-color: rgba(213, 63, 140, 0.2);
      --shadow-color: rgba(213, 63, 140, 0.12);
      --font-hand: 'Caveat', cursive;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      padding-bottom: 80px;
    }

    /* AUTH MODAL */
    #auth-modal {
      display: flex;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-card {
      background: #fff;
      padding: 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .auth-card h2 { color: var(--primary); margin-bottom: 15px; font-family: var(--font-hand); font-size: 32px; }
    .auth-card input {
      width: 100%; padding: 12px; margin-bottom: 12px;
      border: 1px solid #e2e8f0; border-radius: 10px; outline: none; font-size: 14px;
    }
    .auth-card button {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-weight: 600; cursor: pointer; margin-bottom: 8px; font-size: 14px; transition: opacity 0.2s;
    }
    .btn-login { background: var(--primary); color: white; }
    .btn-signup { background: var(--primary-soft); color: white; }
    .btn-google { background: #4285F4; color: white; }
    .auth-divider { margin: 10px 0; color: var(--text-muted); font-size: 12px; }

    /* HEADER */
    header {
      background: var(--bg-card);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 10px var(--shadow-color);
      position: sticky; top: 0; z-index: 100;
    }
    .app-title { font-family: var(--font-hand); font-size: 28px; color: var(--primary); font-weight: 700; }
    .btn-logout { background: none; border: 1px solid var(--primary); color: var(--primary); padding: 5px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 12px; }

    /* CONTAINERS */
    .container { padding: 20px; max-width: 600px; margin: 0 auto; }
    .card { background: var(--bg-card); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 12px var(--shadow-color); border: 1px solid var(--border-color); }
    .card-title { font-family: 'Playfair Display', serif; color: var(--primary); margin-bottom: 15px; font-size: 20px; text-align: center; }

    /* WHATSAPP-STYLE EMOJI PICKER */
    .emoji-categories { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .emoji-group-title { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .emoji-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .emoji-btn { font-size: 24px; background: none; border: 2px solid transparent; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s, border-color 0.2s; }
    .emoji-btn:active { transform: scale(0.9); }
    .emoji-btn.selected { border-color: var(--primary); background: rgba(213, 63, 140, 0.1); }

    /* JOURNAL & PLANNER */
    textarea { width: 100%; height: 100px; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; font-family: inherit; resize: none; margin-top: 10px; outline: none; }
    .task-input { display: flex; gap: 8px; margin-bottom: 12px; }
    .task-input input { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; }
    .task-input button { background: var(--primary); color: white; border: none; padding: 0 15px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .task-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }

    /* NAVIGATION BAR */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border-color); box-shadow: 0 -2px 10px var(--shadow-color); }
    .nav-item { border: none; background: none; color: var(--text-muted); font-size: 12px; font-weight: 500; cursor: pointer; }
    .nav-item.active { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>

  <!-- AUTH MODAL -->
  <div id="auth-modal">
    <div class="auth-card">
      <h2>My Agenda</h2>
      <input type="email" id="auth-email" placeholder="Email Address">
      <input type="password" id="auth-password" placeholder="Password">
      <button class="btn-login" id="btn-login">Log In</button>
      <button class="btn-signup" id="btn-signup">Sign Up</button>
      <div class="auth-divider">OR</div>
      <button class="btn-google" id="btn-google">Sign in with Google</button>
    </div>
  </div>

  <!-- MAIN HEADER -->
  <header>
    <div class="app-title">🌸 My Agenda</div>
    <button class="btn-logout" id="btn-logout">Logout</button>
  </header>

  <!-- APP CONTENT -->
  <div class="container">
    
    <!-- MOOD JOURNAL -->
    <div class="card">
      <h3 class="card-title">How are you feeling today?</h3>
      
      <div class="emoji-categories">
        <span class="emoji-group-title">Happy & Excited</span>
        <div class="emoji-row">
          <button class="emoji-btn" onclick="selectMood('😊')">😊</button>
          <button class="emoji-btn" onclick="selectMood('😄')">😄</button>
          <button class="emoji-btn" onclick="selectMood('😁')">😁</button>
          <button class="emoji-btn" onclick="selectMood('🥳')">🥳</button>
          <button class="emoji-btn" onclick="selectMood('🤩')">🤩</button>
          <button class="emoji-btn" onclick="selectMood('🥰')">🥰</button>
        </div>

        <span class="emoji-group-title">Calm & Peaceful</span>
        <div class="emoji-row">
          <button class="emoji-btn" onclick="selectMood('😌')">😌</button>
          <button class="emoji-btn" onclick="selectMood('😇')">😇</button>
          <button class="emoji-btn" onclick="selectMood('🙂')">🙂</button>
          <button class="emoji-btn" onclick="selectMood('🧘')">🧘</button>
        </div>

        <span class="emoji-group-title">Tired & Stressed</span>
        <div class="emoji-row">
          <button class="emoji-btn" onclick="selectMood('😴')">😴</button>
          <button class="emoji-btn" onclick="selectMood('😫')">😫</button>
          <button class="emoji-btn" onclick="selectMood('🤯')">🤯</button>
          <button class="emoji-btn" onclick="selectMood('😮‍💨')">😮‍💨</button>
        </div>

        <span class="emoji-group-title">Sad & Anxious</span>
        <div class="emoji-row">
          <button class="emoji-btn" onclick="selectMood('😢')">😢</button>
          <button class="emoji-btn" onclick="selectMood('🥺')">🥺</button>
          <button class="emoji-btn" onclick="selectMood('😔')">😔</button>
          <button class="emoji-btn" onclick="selectMood('😰')">😰</button>
        </div>
      </div>

      <textarea id="journal-entry" placeholder="Write down your thoughts..." onchange="saveData()"></textarea>
    </div>

    <!-- DAILY TASKS -->
    <div class="card">
      <h3 class="card-title">Daily Checklist</h3>
      <div class="task-input">
        <input type="text" id="new-task" placeholder="Add a new task...">
        <button onclick="addTask()">Add</button>
      </div>
      <div id="task-list"></div>
    </div>

  </div>

  <!-- NAVIGATION -->
  <nav class="bottom-nav">
    <button class="nav-item active">Planner</button>
    <button class="nav-item">Calendar</button>
    <button class="nav-item">Options</button>
  </nav>

  <!-- FIREBASE MODULE & OFFLINE PERSISTENCE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      enableIndexedDbPersistence, 
      doc, 
      getDoc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAxkGjEb7IS0tZxRD42eSDrwInmA4O4i-s",
      authDomain: "my-daily-planner-53bc2.firebaseapp.com",
      projectId: "my-daily-planner-53bc2",
      storageBucket: "my-daily-planner-53bc2.firebasestorage.app",
      messagingSenderId: "952901002811",
      appId: "1:952901002811:web:8bc2de372a52745ef75034"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // ENABLE OFFLINE PERSISTENCE
    enableIndexedDbPersistence(db).catch((err) => {
      if (err.code == 'failed-precondition') {
        console.warn('Persistence failed: Multiple tabs open');
      } else if (err.code == 'unimplemented') {
        console.warn('Browser does not support offline storage');
      }
    });

    let currentUser = null;
    let localTasks = [];
    let selectedMoodEmoji = '';

    // AUTH LISTENERS
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-modal').style.display = 'none';
        await loadUserData(user.uid);
      } else {
        currentUser = null;
        document.getElementById('auth-modal').style.display = 'flex';
      }
    });

    document.getElementById('btn-login').onclick = async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      try { await signInWithEmailAndPassword(auth, email, pass); } catch(e) { alert(e.message); }
    };

    document.getElementById('btn-signup').onclick = async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      try { await createUserWithEmailAndPassword(auth, email, pass); } catch(e) { alert(e.message); }
    };

    document.getElementById('btn-google').onclick = async () => {
      try { await signInWithPopup(auth, googleProvider); } catch(e) { alert(e.message); }
    };

    document.getElementById('btn-logout').onclick = () => signOut(auth);

    // DATA SYNC
    async function loadUserData(uid) {
      const docRef = doc(db, "users", uid);
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const data = docSnap.data();
        document.getElementById('journal-entry').value = data.journal || '';
        localTasks = data.tasks || [];
        selectedMoodEmoji = data.mood || '';
        highlightSelectedEmoji();
        renderTasks();
      }
    }

    window.saveData = async function() {
      if (!currentUser) return;
      const journalText = document.getElementById('journal-entry').value;
      const payload = {
        journal: journalText,
        tasks: localTasks,
        mood: selectedMoodEmoji,
        updatedAt: new Date().toISOString()
      };
      await setDoc(doc(db, "users", currentUser.uid), payload, { merge: true });
    };

    window.selectMood = function(emoji) {
      selectedMoodEmoji = emoji;
      highlightSelectedEmoji();
      window.saveData();
    };

    function highlightSelectedEmoji() {
      document.querySelectorAll('.emoji-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.innerText === selectedMoodEmoji);
      });
    }

    window.addTask = function() {
      const input = document.getElementById('new-task');
      if (!input.value.trim()) return;
      localTasks.push({ text: input.value, done: false });
      input.value = '';
      renderTasks();
      window.saveData();
    };

    window.toggleTask = function(index) {
      localTasks[index].done = !localTasks[index].done;
      renderTasks();
      window.saveData();
    };

    function renderTasks() {
      const list = document.getElementById('task-list');
      list.innerHTML = '';
      localTasks.forEach((t, i) => {
        list.innerHTML += `
          <div class="task-item">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${i})">
            <span style="${t.done ? 'text-decoration: line-through; color: #a0aec0;' : ''}">${t.text}</span>
          </div>
        `;
      });
    }

    // REGISTER SERVICE WORKER FOR OFFLINE APP LOADING
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
